version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node -v
        - npm -v
        - npm install
        - npm install --prefix client
    build:
      commands:
        - npm run build --prefix client
        - cp -r client/public client/.next/standalone/client/public || true
        - cp -r client/.next/static client/.next/standalone/client/.next/static || true
  artifacts:
    baseDirectory: client/.next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
