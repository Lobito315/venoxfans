version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node -v
        - npm -v
        - npm install
        - npm install --prefix client
    build:
      commands:
        - npm run build --prefix client
        - ls -R client/.next
  artifacts:
    baseDirectory: client/.next
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
